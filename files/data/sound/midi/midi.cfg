# Each <SEQUENCE>.mid in this directory replaces that sequence of gs_sound_data.sdat (SEQ_GS_T_WAKABA.mid replaces
# New Bark Town's theme) when the game is built; see tools/py_scripts/mid2sseq.py for what the MIDI file can use.
# A sequence keeps the game's bank, volume, priorities and player unless a line here changes them:
#
#   SEQ_GS_T_WAKABA.mid: -V100 -GBANK_BGM_FIELD1
#
#   -V<n>  volume, 0 to 127      -G<bank>  bank, by name or number
#   -C<n>  channel priority      -P<n>  player priority      -L<n>  player

# Test: Pewter City over New Bark Town, with Pewter's bank and volume
# SEQ_GS_T_WAKABA.mid: -GBANK_BGM_FIELD16 -V59
